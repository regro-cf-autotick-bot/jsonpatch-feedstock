{% set name = "jsonpatch" %}
{% set version = "1.37" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/jsonpatch-{{ version }}.tar.gz
  sha256: 04288ef93e60084bcb118101cd9d53424e627b91bb47ec5a95c02ec3795f6d23

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pypandoc
    - pip
  run:
    - python >={{ python_min }}
    - jsonpointer >=3.2

test:
  imports:
    - jsonpatch
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/stefankoegl/python-json-patch
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Apply JSON-Patches (RFC 6902)
  dev_url: https://github.com/stefankoegl/python-json-patch
  doc_url: https://python-json-patch.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pavelzw
    - anguslees
    - pmlandwehr
